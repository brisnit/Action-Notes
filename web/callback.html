<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing in… — Action Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { indigo: { brand: '#5E6BF8' }, cyan: { brand: '#22C2FA' }, navy:'#111827', charcoal:'#1F2937', coral:'#F87171' },
      fontFamily: { display: ['"Jockey One"','Inter','sans-serif'], sans: ['Inter','system-ui','sans-serif'] }
    }}}
  </script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="min-h-screen bg-white flex items-center justify-center">

  <div class="text-center">
    <div id="spinner" class="w-16 h-16 mx-auto rounded-2xl brand-gradient flex items-center justify-center">
      <svg class="animate-spin h-8 w-8 text-white" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </div>
    <p class="font-display text-2xl text-navy mt-6">Signing you in…</p>
    <p class="text-gray-600 mt-2">Just a moment.</p>
    <p id="error-msg" class="text-coral mt-4 text-sm hidden"></p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@workos-inc/authkit-js';

    const CLIENT_ID = 'client_01KSN963R31ANVT9FZCPY0G9N6';
    const PRODUCTION_ORIGIN = 'https://action-notes.vercel.app';
    const origin = window.location.hostname === 'localhost'
      ? window.location.origin
      : PRODUCTION_ORIGIN;
    const redirectUri = `${origin}/callback.html`;

    function redirect(role) {
      if (role === 'admin') {
        window.location.replace('admin/onboarding.html');
      } else {
        window.location.replace('participant/onboarding.html');
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('spinner').classList.add('hidden');
      document.querySelector('.font-display').textContent = 'Sign in failed';
      document.querySelector('.text-gray-600').innerHTML =
        '<a href="choose.html" class="text-indigo-brand underline">Go back and try again</a>';
    }

    try {
      let callbackHandled = false;

      const authkit = await createClient(CLIENT_ID, {
        redirectUri,
        onRedirectCallback: ({ user }) => {
          callbackHandled = true;
          const role = sessionStorage.getItem('an_auth_role') || 'participant';
          redirect(role);
        },
      });

      if (callbackHandled) return;

      const user = authkit.getUser();
      if (user) {
        const role = sessionStorage.getItem('an_auth_role') || 'participant';
        redirect(role);
      } else if (window.location.search.includes('code=')) {
        showError('Could not complete sign in. The authorization code may have expired.');
      } else {
        window.location.replace('choose.html');
      }
    } catch (error) {
      console.error('Authentication error:', error);
      showError(error.message || 'Something went wrong during sign in.');
    }
  </script>
</body>
</html>
