<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Action Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { indigo: { brand: '#5E6BF8' }, cyan: { brand: '#22C2FA' }, navy:'#111827', slate:'#161B2E', cloud:'#F6F6FC', charcoal:'#1F2937', mist:'#E5EAF3', mint:'#34D399' },
      fontFamily: { display: ['"Jockey One"','Inter','sans-serif'], sans: ['Inter','system-ui','sans-serif'] }
    }}}
  </script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="hero-glow min-h-screen flex flex-col">

  <header class="max-w-7xl w-full mx-auto px-6 h-16 flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-2">
      <img src="../assets/images/logo.png" alt="Action Notes" class="logo-img" />
    </a>
    <a href="login.html" class="btn-ghost text-sm">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to sign in
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md fade-in">
      <div class="card">
        <div class="w-14 h-14 rounded-2xl brand-gradient flex items-center justify-center text-white">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 class="font-display text-3xl text-navy mt-5">Reset your password</h1>
        <p class="mt-2 text-gray-600">Enter the email you signed up with and we'll send you a link to reset it.</p>

        <form id="form-request" class="mt-6 space-y-4" onsubmit="event.preventDefault(); document.getElementById('form-request').classList.add('hidden'); document.getElementById('sent').classList.remove('hidden');">
          <div>
            <label class="label" for="email">Email</label>
            <input id="email" type="email" required class="input" placeholder="you@email.com" />
          </div>
          <button type="submit" class="btn-primary w-full">Send reset link
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </button>
        </form>

        <div id="sent" class="hidden mt-6 space-y-4">
          <div class="rounded-xl p-4 flex items-start gap-3" style="background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.3)">
            <div class="w-6 h-6 rounded-full bg-mint text-white flex items-center justify-center text-xs">✓</div>
            <div>
              <p class="font-medium text-charcoal">Check your inbox</p>
              <p class="text-sm text-gray-600 mt-1">If an account exists for that email, we just sent a reset link. It expires in 30 minutes.</p>
            </div>
          </div>
          <a href="login.html" class="btn-secondary w-full">Back to sign in</a>
        </div>

        <p class="mt-6 text-sm text-center text-gray-600">
          Don't have an account?
          <a href="signup.html" class="text-indigo-brand font-semibold hover:underline">Create one</a>
        </p>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
